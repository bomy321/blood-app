<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="簡單記錄血壓、脈搏、服藥狀態與備註。"
    />
    <title>日常血壓紀錄</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true">＋</div>
        <div>
          <p class="eyebrow">PERSONAL HEALTH JOURNAL</p>
          <h1>日常血壓紀錄</h1>
          <p class="page-description">每天留意一點，為健康留下安心紀錄。</p>
        </div>
      </header>

      <section class="entry-card" aria-labelledby="form-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">NEW MEASUREMENT</p>
            <h2 id="form-title">新增一筆紀錄</h2>
          </div>
          <span class="date-hint">日期與時間將自動記錄</span>
        </div>

        <form id="record-form">
          <div class="measurement-grid">
            <label class="field">
              <span class="field-label">收縮壓 <span class="unit">mmHg</span></span>
              <input
                name="systolic"
                type="number"
                min="1"
                max="300"
                step="1"
                inputmode="numeric"
                placeholder="例如 120"
                required
              />
            </label>
            <label class="field">
              <span class="field-label">舒張壓 <span class="unit">mmHg</span></span>
              <input
                name="diastolic"
                type="number"
                min="1"
                max="200"
                step="1"
                inputmode="numeric"
                placeholder="例如 80"
                required
              />
            </label>
            <label class="field">
              <span class="field-label">脈搏 <span class="unit">次／分鐘</span></span>
              <input
                name="pulse"
                type="number"
                min="1"
                max="300"
                step="1"
                inputmode="numeric"
                placeholder="例如 72"
                required
              />
            </label>
          </div>

          <div class="details-grid">
            <label class="field">
              <span class="field-label">藥物治療</span>
              <select name="medication">
                <option value="無">無</option>
                <option value="已服藥">已服藥</option>
                <option value="未服藥">未服藥</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">備註 <span class="optional">選填</span></span>
              <input
                name="notes"
                type="text"
                maxlength="300"
                placeholder="記下當下狀況或其他補充"
              />
            </label>
          </div>

          <p id="form-message" class="form-message" role="alert" hidden></p>
          <div class="form-footer">
            <p class="privacy-note">資料只會儲存在這個瀏覽器中。</p>
            <button class="submit-button" type="submit">
              <span aria-hidden="true">＋</span>
              儲存紀錄
            </button>
          </div>
        </form>
      </section>

      <section class="records-section" aria-labelledby="records-title">
        <div class="records-heading">
          <div>
            <p class="eyebrow">YOUR HISTORY</p>
            <h2 id="records-title">血壓紀錄</h2>
          </div>
          <span id="record-count" class="record-count">0 筆紀錄</span>
        </div>
        <div id="records-list" class="records-list" aria-live="polite"></div>
      </section>
      <footer class="page-footer">
        本紀錄僅供個人追蹤參考，若有疑慮請諮詢醫療專業人員。
      </footer>
    </main>
  </body>
</html>
